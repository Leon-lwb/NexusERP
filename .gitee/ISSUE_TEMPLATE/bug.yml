name: Nexus-ERP Bug 反馈
description: 反馈 Nexus-ERP 的业务功能、接口或页面问题，请提供可复现步骤和脱敏证据。
title: "[Nexus-ERP Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 Nexus-ERP 问题。当前维护发布分支为 `plus`，请注明实际运行分支和提交 SHA。
        提交前请阅读仓库根目录的 `doc/README.md`（文档中心）、`CONTRIBUTING.md` 和 `SECURITY.md`。
        日志、截图和示例必须脱敏：不要公开 JWT、Token、API Key、密码、私钥、完整配置或真实租户数据。
        安全漏洞请依 `SECURITY.md` 先向维护者索取经确认的私密接收方式，不在公开 Issue 发布敏感利用细节。
  - type: textarea
    id: version
    attributes:
      label: Nexus-ERP 分支、提交与版本
      description: 请填写实际运行的版本，而不是仅填写上游框架版本；前后端提交不同请分别注明。
      placeholder: |
        分支（当前维护分支 plus）：
        提交 SHA（前后端分别注明）：
        后端版本（根 pom.xml 的 revision）：
        前端版本（plus-ui/package.json）：
    validations:
      required: true
  - type: textarea
    id: module
    attributes:
      label: 受影响模块与功能入口
      description: 请注明业务模块、子功能及页面或 API；跨模块问题请列出相关模块。
      placeholder: |
        模块（ERP / MES / IoT / AI / Flow / IM / CV / Station / 电子签章 / 系统管理 / 前端 / 其他）：
        子功能、页面或 API：
        影响范围：
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境（脱敏）
      description: 不适用项请注明；仅提供版本和环境类型，不要粘贴连接凭据、完整配置或真实业务数据。
      placeholder: |
        操作系统：
        JDK / Maven 版本：
        Node / npm / 浏览器版本：
        部署方式（本地 IDE / JAR / Docker 等）：
        激活的 Maven / Spring 环境：
        数据库 / Redis / RabbitMQ 版本（如相关）：
        是否为隔离测试环境及相关权限、租户条件（脱敏）：
    validations:
      required: true
  - type: checkboxes
    id: pre-checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已阅读 Nexus-ERP 仓库文档中心及相关模块说明。
          required: true
        - label: 我已搜索本仓库的现有 Issues，确认没有相同问题或已注明关联问题。
          required: true
        - label: 我已对日志、截图和示例脱敏，并遵循 SECURITY.md 的公开报告边界。
          required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 提供最小复现的前置条件、操作步骤和输入示例；只使用脱敏或合成数据。
      placeholder: |
        前置条件（权限、租户及数据状态）：
        1. 进入页面或调用接口：
        2. 输入或操作：
        3. 观察问题：
        复现频率：
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: 预期结果
      description: 说明正确的业务行为或页面、接口返回结果。
      placeholder: 描述完成上述步骤后应出现的结果。
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: 实际结果
      description: 说明实际发生的行为、错误信息及与预期的差异。
      placeholder: 描述实际结果、业务影响及是否存在临时绕过方式。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志、截图与补充信息
      description: 可附最小代码、错误堆栈或截图；删除凭据、个人信息和真实业务数据，不上传完整配置或数据库备份。
      placeholder: 请用代码块粘贴脱敏日志，或上传已遮蔽敏感信息的截图。
    validations:
      required: false
