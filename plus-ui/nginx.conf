worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 100000;
    client_max_body_size 100m;
    client_header_buffer_size 32k;
    client_body_buffer_size   512k;
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # host 模式下本机后端服务通过 127.0.0.1 访问
    upstream server {
        ip_hash;
        server 127.0.0.1:8080;
    }

    # 监控中心在辅助服务器上
    upstream monitor-admin {
        server 117.72.190.225:9090;
    }

    # SnailJob 调度中心在辅助服务器上
    upstream snailjob-server {
        server 117.72.190.225:8800;
    }

    # HTTP 80 端口：强制跳转到 HTTPS（证书配置完成后取消注释）
    # server {
    #     listen       80;
    #     server_name  nexuserp.website www.nexuserp.website;
    #     return 301   https://$server_name$request_uri;
    # }

    server {
        listen       80;
        server_name  nexuserp.website www.nexuserp.website 159.75.14.226;

        # ==========================================
        # HTTPS 配置（申请 SSL 证书后，取消以下注释并上传证书到 /docker/nginx/cert/）
        # ==========================================
        # listen       443 ssl;
        # ssl_certificate      /etc/nginx/cert/nexuserp.website.crt;
        # ssl_certificate_key  /etc/nginx/cert/nexuserp.website.key;
        # ssl_session_timeout 5m;
        # ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        # ssl_protocols TLSv1.3 TLSv1.2 TLSv1.1 TLSv1;
        # ssl_prefer_server_ciphers on;

        location ~ ^(/[^/]*)?/actuator.*(/.*)?$ {
            return 403;
        }

        location / {
            root   /usr/share/nginx/html/dist;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # pdfjs 的 worker 由 Vite 产出为独立 ESM 资源（dist/assets/pdf.worker.min-*.mjs），
        # 而 nginx 自带的 conf/mime.types（1.23.4 亦然）里没有 mjs 映射，会落到上面的
        # default_type application/octet-stream；浏览器不允许非 JS MIME 的 module worker，
        # pdfjs 会直接报「Failed to load module script …」，PDF 预览整段不可用。
        # 故对 *.mjs 显式声明 JS 类型。注意正则 location 的优先级高于前缀 location，
        # 这里显式排除反代前缀，避免把 /prod-api/、/admin/、/snail-job/ 下的请求抢到静态目录来。
        location ~* "^/(?!prod-api/|admin/|snail-job/).*\.mjs$" {
            root  /usr/share/nginx/html/dist;
            types { application/javascript mjs; }
        }

        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://server/;
        }

        # Keep the legacy monitor links working without duplicating upstream paths.
        location = /monitor/Admin {
            return 302 /admin/;
        }

        location = /monitor/Admin/ {
            return 302 /admin/;
        }

        location = /monitor/snailjob {
            return 302 /snail-job/;
        }

        location = /monitor/snailjob/ {
            return 302 /snail-job/;
        }

        location /admin/ {
            # Spring Boot Admin's form login can return /admin/?continue;
            # the SPA renders correctly after the query string is removed.
            if ($args = continue) {
                return 302 /admin/;
            }

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://monitor-admin/admin/;
        }

        location /snail-job/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://snailjob-server/snail-job/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
