# 完整的可选集成密钥结构；没有真实凭证。复制到仓库外或config/application-secret.yml后填写。
# 不会自动加载.example.yml；变量为空不会自动启用功能。短信额外启用sms，第三方登录额外启用social。
# 也可直接填写私有值，但不要提交文件或复制到JAR。
secret:
  tavily:
    api-key: ${WEB_SEARCH_API_KEY:}
  mail:
    from: ${MAIL_FROM:}
    user: ${MAIL_USER:}
    pass: ${MAIL_PASS:}
  sms:
    config1:
      access-key-id: ${SMS_CONFIG1_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_CONFIG1_ACCESS_KEY_SECRET:}
      signature: ${SMS_CONFIG1_SIGNATURE:}
      sdk-app-id: ${SMS_CONFIG1_SDK_APP_ID:}
    config2:
      access-key-id: ${SMS_CONFIG2_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_CONFIG2_ACCESS_KEY_SECRET:}
      signature: ${SMS_CONFIG2_SIGNATURE:}
      sdk-app-id: ${SMS_CONFIG2_SDK_APP_ID:}
  justauth:
    maxkey:
      client-id: ${SOCIAL_MAXKEY_CLIENT_ID:}
      client-secret: ${SOCIAL_MAXKEY_CLIENT_SECRET:}
    topiam:
      client-id: ${SOCIAL_TOPIAM_CLIENT_ID:}
      client-secret: ${SOCIAL_TOPIAM_CLIENT_SECRET:}
    gitee:
      client-id: ${SOCIAL_GITEE_CLIENT_ID:}
      client-secret: ${SOCIAL_GITEE_CLIENT_SECRET:}
    qq:
      client-id: ${SOCIAL_QQ_CLIENT_ID:}
      client-secret: ${SOCIAL_QQ_CLIENT_SECRET:}
    weibo:
      client-id: ${SOCIAL_WEIBO_CLIENT_ID:}
      client-secret: ${SOCIAL_WEIBO_CLIENT_SECRET:}
    dingtalk:
      client-id: ${SOCIAL_DINGTALK_CLIENT_ID:}
      client-secret: ${SOCIAL_DINGTALK_CLIENT_SECRET:}
    baidu:
      client-id: ${SOCIAL_BAIDU_CLIENT_ID:}
      client-secret: ${SOCIAL_BAIDU_CLIENT_SECRET:}
    csdn:
      client-id: ${SOCIAL_CSDN_CLIENT_ID:}
      client-secret: ${SOCIAL_CSDN_CLIENT_SECRET:}
    coding:
      client-id: ${SOCIAL_CODING_CLIENT_ID:}
      client-secret: ${SOCIAL_CODING_CLIENT_SECRET:}
    oschina:
      client-id: ${SOCIAL_OSCHINA_CLIENT_ID:}
      client-secret: ${SOCIAL_OSCHINA_CLIENT_SECRET:}
    alipay-wallet:
      client-id: ${SOCIAL_ALIPAY_WALLET_CLIENT_ID:}
      client-secret: ${SOCIAL_ALIPAY_WALLET_CLIENT_SECRET:}
      alipay-public-key: ${SOCIAL_ALIPAY_WALLET_ALIPAY_PUBLIC_KEY:}
    wechat-open:
      client-id: ${SOCIAL_WECHAT_OPEN_CLIENT_ID:}
      client-secret: ${SOCIAL_WECHAT_OPEN_CLIENT_SECRET:}
    wechat-mp:
      client-id: ${SOCIAL_WECHAT_MP_CLIENT_ID:}
      client-secret: ${SOCIAL_WECHAT_MP_CLIENT_SECRET:}
    wechat-enterprise:
      client-id: ${SOCIAL_WECHAT_ENTERPRISE_CLIENT_ID:}
      client-secret: ${SOCIAL_WECHAT_ENTERPRISE_CLIENT_SECRET:}
    gitlab:
      client-id: ${SOCIAL_GITLAB_CLIENT_ID:}
      client-secret: ${SOCIAL_GITLAB_CLIENT_SECRET:}
    gitea:
      client-id: ${SOCIAL_GITEA_CLIENT_ID:}
      client-secret: ${SOCIAL_GITEA_CLIENT_SECRET:}
  pay:
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      app-private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    wechat:
      merchant-id: ${WECHAT_MERCHANT_ID:}
      merchant-serial-number: ${WECHAT_MERCHANT_SERIAL_NUMBER:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      app-id: ${WECHAT_APP_ID:}
    sqb:
      terminal-sn: ${SQB_TERMINAL_SN:}
      terminal-key: ${SQB_TERMINAL_KEY:}
      app-id: ${SQB_APP_ID:}
      vendor-sn: ${SQB_VENDOR_SN:}
      vendor-key: ${SQB_VENDOR_KEY:}
