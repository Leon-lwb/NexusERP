# =====================================================================
# dev 开箱即用演示凭证（公开文件，随仓库与 JAR 分发）
# ---------------------------------------------------------------------
# 目的：社区用户克隆后，本机中间件按下列演示值部署即可直接启动，
#       无需先创建任何私有配置文件。
# 本文件只定义 DB_PASSWORD / REDIS_PASSWORD / MQ_PASSWORD 三 个
# "演示环境变量默认值"键——dev 配置只通过占位符引用它们、从不重复定义，
# 因此覆盖关系简单可靠（高 → 低）：
#   1. 真实环境变量 DB_PASSWORD / REDIS_PASSWORD / MQ_PASSWORD 等
#   2. 仓库根 config/application-secret.yml（git 已忽略，用同名键书写）
#   3. 本文件的演示兜底值（root / ruoyi123 / nexus，仅指向本机 localhost）
# 生产环境不加载本文件（prod 走外部 config/ 与环境变量注入）。
# =====================================================================
DB_PASSWORD: root
REDIS_PASSWORD: ruoyi123
MQ_PASSWORD: nexus
