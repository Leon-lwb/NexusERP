      packages-to-scan: com.nexus.erp
    - group: 7.支付模块
      packages-to-scan: com.nexus.pay

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice
    - /workflow/model/save

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁的超时时间，默认为 30 秒
  expire: 30000

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: true
  # 路径
  path: /websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # Flowable 配置
flowable:
  # 关闭定时任务 job
  async-executor-activate: false
  # 库与数据库表结构不一致时，会自动将数据库表结构升级至新版本。
  database-schema-update: true
  idm:
    # 关闭idm引擎 数据库不会创建act_id_*表，流程流转不会使用act_id_*相关的表
    enabled: false
  # 关闭流程定义文件自动检查
  check-process-definitions: false
  # 关闭历史任务定时任务job
  async-history-executor-activate: false
  #消息链接基地址
  message-base-url: /workflow/process/detail/

--- # mq 消息队列通用配置
mq:
  rabbit:
    enabled: true
    exchange-prefix: erp
    message-record-enabled: true
    max-retry: 3
    compensation-resend-threshold: 60000

--- # NexusERP AI 配置
nexus:
  # IoT MQTT 内嵌 Broker（Moquette）
  iot:
    mqtt:
      enabled: true
      host: 0.0.0.0
      port: 1883
      allow-anonymous: false
      # WebSocket 端口（供浏览器 MQTT.js 模拟器接入），<=0 不启动
      websocket-port: 8083
      status-ttl-seconds: 3600
    # 数据管道（MQTT → Redis Streams → MySQL + Redis 缓存，Week 34）
    pipeline:
      stream-key: iot:data:stream
      consumer-group: iot-consumers
      consumer-name: iot-consumer-1
      batch-size: 100
      block-ms: 1000
      max-retry: 3
      consumer-enabled: true
      # 硬编码告警阈值：propertyCode → 阈值（numericValue 超过即告警）
      alert-thresholds:
        temperature: 80
  ai:
    default-provider: deepseek
    default-model: deepseek-chat
    allowed-table-prefixes: bd_,so_,pu_,prd_,wm_,sch_
    sql-timeout: 5000
    sql-max-rows: 1000
    flow:
      # 并行分支执行（默认关；含循环的图强制串行）
      parallel: false
      parallel-workers: 4
    vector-store:
      # 向量存储类型：milvus（持久化，重启不丢）/ inmemory（仅内存，重启清空，仅用于无 Milvus 环境的演示）
      # ⚠️ inmemory 模式下重启服务后向量全部丢失，RAG 检索返回空；生产必须用 milvus
      type: milvus
      milvus:
        url: http://localhost:19530
        collection-name: AiKnowledge
      inmemory:
        enabled: true
    # 推理模式（Thinking）
    thinking:
      enabled: true
      default-on: false
    # 联网搜索
    web-search:
      enabled: true
      provider: tavily
      api-key: ${WEB_SEARCH_API_KEY:}
      top-n: 5
      timeout-ms: 15000
    # 文生图
    image:
      enabled: true
      default-provider: Tongyiwanx
    # 知识图谱
    knowledge-graph:
      enabled: true
      storage: mysql
      batch-size: 5
      max-entities-per-chunk: 20
      max-relations-per-chunk: 30
      confidence-threshold: 0.5
      extraction-model-id: 1        # deepseek-v4-flash（DeepSeek 官方）
      graph-weight: 0.5
      max-neighbors: 20
      label-propagation-max-iter: 8
      max-communities: 50
      max-communities-for-global: 50
      gleaning-enabled: false

  # 视觉识别服务 (nexus-vision-service)
  vision:
    base-url: http://localhost:5001
    api-key: ${VISION_API_KEY:dev-key-nexus-erp}
    timeout-ms: 5000
    max-image-dim: 4096
    enabled: true
    health-fail-threshold: 3
