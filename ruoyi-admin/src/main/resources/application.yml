# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 50MB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 48

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    com.nexus: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Jasypt加密配置
# 生产必须通过环境变量 JASYPT_PASSWORD 覆盖默认口令——默认口令随仓库公开时，库内 ENC() 密文等同明文
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:nJVt3Aj3ikA0aA27JLsG17wXl0phKpOoz88GJUNPwDw}
    algorithm: PBEWITHHMACSHA512ANDAES_256

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  # 强制 CGLIB 代理
  aop:
    proxy-target-class: true
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: false
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
      # 显式约束线程池，避免 Spring 默认无界队列(max/queue=Integer.MAX_VALUE)在 @Async 高并发下内存膨胀
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 200
        keep-alive: 60s
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥（生产必须通过环境变量 SA_TOKEN_JWT_SECRET_KEY 覆盖；此默认值仅限本地开发，
  # 不得使用顺序字符串等弱秘钥——弱秘钥可被伪造任意用户 token）
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET_KEY:68HYmn7pmB0KciEO5408aT4J3MhvFXsnrekdodED-ns92EGA9YuXBAukgwOUkCjS}

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    - /warm-flow-ui/config
    # 支付回调（无需登录验证）
    - /pay/*/notify
    - /pay/*/notify/**
    # AI 流程 Webhook 入站触发（内部按 flowKey/token 鉴权）
    - /ai/flow/webhook/**
    # 固件刷写/测试自动化上报接口（内部按 X-API-KEY 鉴权）
    - /mes/flash/report/**
    # 工位终端设备通道接口（nexus-station，内部按 X-API-KEY 鉴权）
    - /mes/station/**
    # 积木报表（内部自行鉴权）
    - /jmreport/**
    - /drag/**
    - /jmreport-designer/**
    - /jmubi/**

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    # MQ 消息记录表（实体无 tenant_id 字段，全局共享；多租户插件注入 tenant_id 会导致 Unknown column 报错）
    - mq_message_record
    - mq_compensation_record
    - mq_dead_letter_record
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel
    # 积木报表表（无 tenant_id 字段）
    - jm_report
    - jm_report_db_param
    - jm_report_db_source
    - jm_report_link
    - jm_report_map
    - jm_report_share
    - jm_report_tree
    - jm_report_collect
    - jm_report_page
    - jm_report_datasource
    - jm_report_template
    - jm_report_data
    - jm_drag_page
    - jm_drag_component

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 com.nexus.**.mapper,org.xxx.**.mapper
  mapperPackage: com.nexus.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.nexus.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
