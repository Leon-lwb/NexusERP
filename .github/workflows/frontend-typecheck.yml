# P0-6 回归门禁: 前端变更文件类型检查
#
# 背景: 全项目 vue-tsc 约 1580 个既有错误(baseline 噪声, tsconfig strict 实质关闭),
# 不能用退出码判断是否引入新错。策略: 仅阻断"本次变更文件"中的类型错误,
# 未变更文件的既有错误不阻断(见 plus-ui/scripts/check-tsc-diff.mjs)。
#
# 说明:
#   - PR 场景: 用 GITHUB_BASE_SHA 与 HEAD 对比(three-dot diff)
#   - push 场景: 无 base, 脚本回退与 HEAD~1 对比(仅检查最后一次提交)
name: Frontend Type Check

on:
  push:
    branches:
      - plus
      - master
    paths:
      - 'plus-ui/**'
      - '.github/workflows/frontend-typecheck.yml'
  pull_request:
    branches:
      - plus
      - master
    paths:
      - 'plus-ui/**'
      - '.github/workflows/frontend-typecheck.yml'

jobs:
  typecheck-changed:
    name: vue-tsc (changed files only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史用于 three-dot diff; PR 场景 checkout 已含 base 提交
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plus-ui/package-lock.json

      - name: Install dependencies
        working-directory: plus-ui
        run: npm ci

      - name: Run vue-tsc
        working-directory: plus-ui
        # vue-tsc 基线错误必然非零退出, 不能作为失败信号; 输出落盘交由 diff 脚本判定
        run: npx vue-tsc --noEmit > /tmp/tsc.out 2>&1 || true

      - name: Check errors in changed files
        working-directory: plus-ui
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-tsc-diff.mjs /tmp/tsc.out
