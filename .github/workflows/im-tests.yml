# P3-10: IM 模块 CI 自动化测试 + 覆盖率报告
#
# 触发条件：push/PR 到 feature/im-p0-stability-fix 或 main 分支，且改动 ruoyi-im 模块或其依赖
# 执行内容：
#   1. 编译 ruoyi-im 模块及其依赖（-am = also make）
#   2. 运行单元测试（默认排除 @Tag("integration")）
#   3. 生成 JaCoCo 覆盖率报告（target/site/jacoco/jacoco.xml）
#   4. 覆盖率门槛校验（默认 haltOnFailure=false，仅警告；稳定后可改 true）
#   5. 上传覆盖率报告到 CI 制品库（供下载/可视化）
#
# 集成测试（@Tag("integration")）单独 job 触发，需要完整测试环境（DB/Redis/WebSocket）。
# 本文件兼容 GitHub Actions；Gitee Go 可参考此结构改写为 .gitee/workflows/*.yml。
name: IM Tests

on:
  push:
    branches:
      - feature/im-p0-stability-fix
      - main
    paths:
      - 'ruoyi-modules/ruoyi-im/**'
      - 'ruoyi-common/**'
      - '.github/workflows/im-tests.yml'
  pull_request:
    branches:
      - feature/im-p0-stability-fix
      - main
    paths:
      - 'ruoyi-modules/ruoyi-im/**'
      - 'ruoyi-common/**'
      - '.github/workflows/im-tests.yml'

jobs:
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run IM Unit Tests (with JaCoCo)
        # 根 pom 默认 <skipTests>true</skipTests>，需通过 -DskipTests=false 覆盖
        # -am = 同时构建依赖模块（ruoyi-common-* 等）
        # -pl = 只构建 ruoyi-im 模块
        # JaCoCo report/check 绑定到 test phase，mvn test 会自动触发
        run: mvn -pl ruoyi-modules/ruoyi-im -am test -DskipTests=false

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: im-jacoco-report
          path: ruoyi-modules/ruoyi-im/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Print Coverage Summary
        if: always()
        run: |
          echo "## IM Module Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ruoyi-modules/ruoyi-im/target/site/jacoco/jacoco.csv ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ruoyi-modules/ruoyi-im/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_jacoco.csv not generated (no test execution data)_" >> $GITHUB_STEP_SUMMARY
          fi

  # P3-9 集成测试样板（@Tag("integration")）单独 job，需要 DB/Redis 测试环境
