# ===================================================================
# 主服务器部署编排配置（81.68.78.136）
# 包含服务：MySQL、Redis、RabbitMQ、MinIO、Nginx、NexusServer
# 使用方式：docker compose -f docker-compose-main.yml up -d
#
# 说明：本文件由原 docker-compose.yml 拆分而来，与《docker部署文档.md》
#       第一节部署架构、第七节主服务器部署、第十一节访问地址汇总保持一致。
# ===================================================================
services:
  nexus-mysql:
    image: mysql:8.0.42
    container_name: nexus-mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码（与 application-prod.yml 保持一致）
      MYSQL_ROOT_PASSWORD: MIS@5mis@5
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nexus-redis:
    image: redis:7.2.8
    container_name: nexus-redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件（redis.conf 中 requirepass ruoyi123，部署文档未明确 Redis 密码故保留）
      - /docker/redis/conf:/redis/config:rw
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  nexus-rabbitmq:
    image: rabbitmq:3-management
    container_name: nexus-rabbitmq
    ports:
      # AMQP 通信端口
      - "5672:5672"
      # 管理后台端口
      - "15672:15672"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 默认账号密码（部署文档第十一节：nexus / nexus）
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus
    volumes:
      # 数据持久化
      - /docker/rabbitmq/data:/var/lib/rabbitmq
    privileged: true
    network_mode: "host"

  nexus-minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: nexus-minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名（部署文档：nexus）
      MINIO_ROOT_USER: nexus
      # 管理后台密码，最小8个字符（部署文档：nexus123456）
      MINIO_ROOT_PASSWORD: nexus123456
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  nexus-nginx:
    image: nginx:1.23.4
    container_name: nexus-nginx
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  nexus-server:
    image: nexus/nexus-server:5.6.0
    container_name: nexus-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SNAIL_PORT: 28080
      # JVM 参数（部署文档第一节：NexusServer JVM 384M）
      JAVA_OPTS: "-Xms256m -Xmx384m -XX:MaxMetaspaceSize=256m -XX:+UseZGC"
    volumes:
      # 日志目录
      - /docker/server/logs/:/ruoyi/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/ruoyi/skywalking/agent
    privileged: true
    network_mode: "host"
