# ===================================================================
# 主服务器部署编排配置 (159.75.14.226 - 4C4G)
# 包含服务：MySQL 5.7、Redis、RabbitMQ、MinIO、Nginx、NexusServer
# 使用方式：docker compose -f docker-compose-main.yml up -d
# ===================================================================
services:
  nexus-mysql:
    image: mysql:5.7
    container_name: nexus-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: MIS@5mis@5
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    volumes:
      - /docker/mysql/data/:/var/lib/mysql/
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --innodb-buffer-pool-size=512M
      --max-allowed-packet=256M
      --innodb-log-file-size=256M
    privileged: true
    network_mode: "host"

  nexus-redis:
    image: redis:7.2.8
    container_name: nexus-redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /docker/redis/conf:/redis/config:rw
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  nexus-rabbitmq:
    image: rabbitmq:3-management
    container_name: nexus-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexuspw
    volumes:
      - /docker/rabbitmq/data:/var/lib/rabbitmq
    privileged: true
    network_mode: "host"

  nexus-minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z
    container_name: nexus-minio
    ports:
      - "9005:9005"
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      - /docker/minio/data:/data
      - /docker/minio/config:/root/.minio/
    command: server --address ':9005' --console-address ':9001' /data
    privileged: true
    network_mode: "host"

  nexus-nginx:
    image: nginx:1.23.4
    container_name: nexus-nginx
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /docker/nginx/cert:/etc/nginx/cert
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - /docker/nginx/html:/usr/share/nginx/html
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  nexus-server:
    image: nexus/nexus-server:5.6.0
    container_name: nexus-server
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SNAIL_PORT: 28080
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseZGC -Dsnail-job.enabled=false"
    volumes:
      - /docker/server/logs/:/ruoyi/server/logs/
    privileged: true
    network_mode: "host"
