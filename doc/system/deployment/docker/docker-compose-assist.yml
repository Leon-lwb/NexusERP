# ===================================================================
# 辅助服务器部署编排配置（117.72.190.225）
# 包含服务：MonitorAdmin、SnailJobServer
# 使用方式：docker compose -f docker-compose-assist.yml up -d
#
# 说明：本文件由原 docker-compose.yml 拆分而来，与《docker部署文档.md》
#       第一节部署架构、第八节辅助服务器部署、第十一节访问地址汇总保持一致。
# ===================================================================
services:
  nexus-monitor:
    image: nexus/nexus-monitor:5.6.0
    container_name: nexus-monitor
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # JVM 参数（部署文档第一节：MonitorAdmin JVM 192M）
      JAVA_OPTS: "-Xms128m -Xmx192m -XX:MaxMetaspaceSize=128m"
    volumes:
      # 日志目录
      - /docker/monitor/logs/:/ruoyi/monitor/logs
    privileged: true
    network_mode: "host"

  nexus-snailjob:
    image: nexus/nexus-snailjob:5.6.0
    container_name: nexus-snailjob
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # JVM 参数（部署文档第一节：SnailJobServer JVM 192M）
      JAVA_OPTS: "-Xms128m -Xmx192m -XX:MaxMetaspaceSize=128m"
    ports:
      # Web 控制台端口
      - "8800:8800"
      # Server RPC 端口
      - "17888:17888"
    volumes:
      # 日志目录
      - /docker/snailjob/logs/:/ruoyi/snailjob/logs
    privileged: true
    network_mode: "host"
