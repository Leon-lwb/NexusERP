<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP 智能驾驶舱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  :root {
    --bg-primary: #0a0e27;
    --bg-secondary: #0f1535;
    --bg-card: rgba(14, 22, 56, 0.85);
    --border-glow: rgba(0, 194, 255, 0.25);
    --accent-cyan: #00c2ff;
    --accent-blue: #0066ff;
    --accent-green: #00e396;
    --accent-orange: #feb019;
    --accent-red: #ff4560;
    --accent-purple: #775dd0;
    --text-primary: #e8edf5;
    --text-secondary: rgba(200, 215, 245, 0.65);
    --text-value: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100vh;
    width: 100%;
  }

  /* === Background Effects === */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0, 194, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 194, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .bg-glow {
    position: fixed; z-index: 0;
    width: 600px; height: 600px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.12;
    animation: glowPulse 8s ease-in-out infinite alternate;
  }
  .bg-glow-1 { top: -200px; left: -100px; background: var(--accent-cyan); }
  .bg-glow-2 { bottom: -200px; right: -100px; background: var(--accent-blue); animation-delay: -4s; }
  .bg-glow-3 { top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent-purple); opacity: 0.06; width: 800px; height: 800px; }

  @keyframes glowPulse {
    0% { opacity: 0.08; transform: scale(1); }
    100% { opacity: 0.15; transform: scale(1.15); }
  }

  /* === Layout === */
  .dashboard {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    min-height: 100vh; padding: 12px 20px 16px;
    gap: 12px;
  }

  /* === Header === */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
    height: 56px; flex-shrink: 0;
  }

  .header-left, .header-right {
    display: flex; align-items: center; gap: 16px;
    min-width: 280px;
  }
  .header-right { justify-content: flex-end; }

  .header-deco {
    width: 200px; height: 2px;
    background: linear-gradient(90deg, var(--accent-cyan), transparent);
    border-radius: 1px;
  }
  .header-right .header-deco {
    background: linear-gradient(270deg, var(--accent-cyan), transparent);
  }

  .header-title {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
    font-size: 26px; font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #00c2ff 0%, #00e396 50%, #00c2ff 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: titleShimmer 4s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(0, 194, 255, 0.3);
  }

  @keyframes titleShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .header-time {
    font-family: 'Orbitron', monospace;
    font-size: 14px; color: var(--accent-cyan);
    letter-spacing: 2px;
  }

  .header-date {
    font-size: 12px; color: var(--text-secondary);
    letter-spacing: 1px;
  }

  /* === KPI Row === */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    flex-shrink: 0;
  }

  .kpi-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    padding: 16px 18px;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .kpi-card:hover {
    border-color: rgba(0, 194, 255, 0.5);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0, 194, 255, 0.12);
  }

  .kpi-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0.6;
  }

  .kpi-card .kpi-icon {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 40px; opacity: 0.08;
  }

  .kpi-label {
    font-size: 12px; color: var(--text-secondary);
    letter-spacing: 1px; margin-bottom: 6px;
  }

  .kpi-value {
    font-family: 'Orbitron', monospace;
    font-size: 26px; font-weight: 700;
    color: var(--text-value);
    line-height: 1.2;
  }

  .kpi-change {
    font-size: 11px; margin-top: 6px;
    display: flex; align-items: center; gap: 4px;
  }
  .kpi-change.up { color: var(--accent-green); }
  .kpi-change.down { color: var(--accent-red); }

  /* === Main Content === */
  .main-content {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }

  .panel {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: border-color 0.3s ease;
  }
  .panel:hover {
    border-color: rgba(0, 194, 255, 0.4);
  }

  .panel::after {
    content: '';
    position: absolute; bottom: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
    opacity: 0.3;
  }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex-shrink: 0;
  }

  .panel-title {
    font-size: 14px; font-weight: 500;
    letter-spacing: 2px;
    display: flex; align-items: center; gap: 8px;
  }

  .panel-title::before {
    content: '';
    width: 3px; height: 14px;
    background: var(--accent-cyan);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--accent-cyan);
  }

  .panel-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(0, 194, 255, 0.1);
    color: var(--accent-cyan);
    border: 1px solid rgba(0, 194, 255, 0.2);
  }

  .panel-body {
    flex: 1; min-height: 0;
  }

  .chart-container {
    width: 100%; height: 100%;
  }

  /* === Center Panel (span 2 rows) === */
  .panel-center {
    grid-column: 2;
    grid-row: 1 / 3;
  }

  /* === Data Table === */
  .data-table {
    width: 100%; font-size: 12px;
    border-collapse: collapse;
  }
  .data-table th {
    text-align: left; padding: 6px 8px;
    color: var(--text-secondary);
    font-weight: 400; letter-spacing: 1px;
    border-bottom: 1px solid rgba(0, 194, 255, 0.1);
  }
  .data-table td {
    padding: 7px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .data-table tr:hover td {
    background: rgba(0, 194, 255, 0.04);
  }

  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; margin-right: 6px;
  }
  .status-dot.green { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
  .status-dot.orange { background: var(--accent-orange); box-shadow: 0 0 6px var(--accent-orange); }
  .status-dot.red { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

  /* === Progress Bar === */
  .progress-bar {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 3px;
    transition: width 1.5s ease;
  }

  /* === Scroll List === */
  .scroll-list {
    flex: 1; overflow: hidden;
    position: relative;
  }
  .scroll-list-inner {
    animation: scrollUp 20s linear infinite;
  }
  .scroll-list:hover .scroll-list-inner {
    animation-play-state: paused;
  }
  @keyframes scrollUp {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }

  /* === Animations === */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .kpi-card { animation: fadeInUp 0.6s ease backwards; }
  .kpi-card:nth-child(1) { animation-delay: 0.1s; }
  .kpi-card:nth-child(2) { animation-delay: 0.2s; }
  .kpi-card:nth-child(3) { animation-delay: 0.3s; }
  .kpi-card:nth-child(4) { animation-delay: 0.4s; }
  .kpi-card:nth-child(5) { animation-delay: 0.5s; }
  .kpi-card:nth-child(6) { animation-delay: 0.6s; }

  .panel { animation: fadeInUp 0.8s ease backwards; }
  .panel:nth-child(1) { animation-delay: 0.3s; }
  .panel:nth-child(2) { animation-delay: 0.4s; }
  .panel:nth-child(3) { animation-delay: 0.5s; }
  .panel:nth-child(4) { animation-delay: 0.6s; }
  .panel:nth-child(5) { animation-delay: 0.7s; }

  /* === Number Counter Animation === */
  .counter { display: inline-block; }

  /* === Responsive === */
  @media (max-width: 1600px) {
    .kpi-value { font-size: 22px; }
    .header-title { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="dashboard">
  <!-- Header -->
  <div class="header">

      <div class="kpi-icon">🏭</div>

    </div>
    <div class="kpi-card">
      <div class="kpi-icon">👥</div>

      <div class="kpi-value"><span class="counter" data-target="3286">0</span></div>

  <div class="main-content">

    <!-- Center: Core Metrics Map + Overview -->
    <div class="panel panel-center">
      <div class="panel-header">

    <div class="panel">

<script>
// === Clock ===
function updateClock() {
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
  const dateStr = now.toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' });
  document.getElementById('headerTime').textContent = timeStr;
  document.getElementById('headerDate').textContent = dateStr;
}
updateClock();
setInterval(updateClock, 1000);

// === Counter Animation ===
function animateCounters() {
  document.querySelectorAll('.counter').forEach(el => {
    const target = parseInt(el.dataset.target);
    const duration = 2000;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.floor(eased * target);
      el.textContent = current.toLocaleString();
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}
setTimeout(animateCounters, 300);

// === Chart Theme ===
const chartTheme = {
  textStyle: { fontFamily: "'Noto Sans SC', sans-serif", color: '#c8d7f5' },
  title: { textStyle: { color: '#e8edf5' } },
};

// === Sales Trend ===
const chartSales = echarts.init(document.getElementById('chartSalesTrend'));
chartSales.setOption({
  ...chartTheme,
  tooltip: {
    trigger: 'axis',
    backgroundColor: 'rgba(10, 14, 39, 0.9)',
    borderColor: 'rgba(0, 194, 255, 0.3)',
    textStyle: { color: '#e8edf5', fontSize: 12 }
  },
  grid: { left: 50, right: 16, top: 30, bottom: 30 },
  legend: {
    data: ['营收(万)', '订单量'],
    textStyle: { color: '#c8d7f5', fontSize: 11 },
    top: 0, right: 0
  },
  xAxis: {
    type: 'category',
    data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
    axisLine: { lineStyle: { color: 'rgba(0,194,255,0.15)' } },
    axisLabel: { color: '#c8d7f5', fontSize: 11 }
  },
  yAxis: [
    {
      type: 'value', name: '万元',
      axisLine: { show: false },
      splitLine: { lineStyle: { color: 'rgba(0,194,255,0.06)' } },
      axisLabel: { color: '#c8d7f5', fontSize: 10 },
      nameTextStyle: { color: '#c8d7f5', fontSize: 10 }
    },
    {
      type: 'value', name: '单',
      axisLine: { show: false },
      splitLine: { show: false },
      axisLabel: { color: '#c8d7f5', fontSize: 10 },
      nameTextStyle: { color: '#c8d7f5', fontSize: 10 }
    }
  ],
  series: [
    {
      name: '营收(万)', type: 'line', smooth: true,
      data: [186, 205, 237, 258, 243, 289, 285],
      lineStyle: { color: '#00c2ff', width: 2 },
      itemStyle: { color: '#00c2ff' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(0, 194, 255, 0.25)' },
          { offset: 1, color: 'rgba(0, 194, 255, 0.01)' }
        ])
      },
      symbol: 'circle', symbolSize: 6
    },
    {
      name: '订单量', type: 'bar', yAxisIndex: 1,
      data: [1120, 1350, 1480, 1560, 1420, 1680, 1583],
      barWidth: 16,
      itemStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(0, 227, 150, 0.8)' },
          { offset: 1, color: 'rgba(0, 227, 150, 0.15)' }
        ]),
        borderRadius: [3, 3, 0, 0]
      }
    }
  ]
});

// === Overview Center Chart ===
const chartOverview = echarts.init(document.getElementById('chartOverview'));
chartOverview.setOption({
  ...chartTheme,
  tooltip: {
    backgroundColor: 'rgba(10, 14, 39, 0.9)',
    borderColor: 'rgba(0, 194, 255, 0.3)',
    textStyle: { color: '#e8edf5', fontSize: 12 }
  },
  grid: { left: 50, right: 30, top: 60, bottom: 80 },
  legend: {
    data: ['营收', '成本', '利润', '目标'],
    textStyle: { color: '#c8d7f5', fontSize: 11 },
    top: 0
  },
  xAxis: {

    data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
    axisLine: { lineStyle: { color: 'rgba(0,194,255,0.15)' } },
    axisLabel: { color: '#c8d7f5', fontSize: 11 }
  },
  yAxis: {
    type: 'value', name: '万元',
    axisLine: { show: false },
    splitLine: { lineStyle: { color: 'rgba(0,194,255,0.06)' } },
    axisLabel: { color: '#c8d7f5', fontSize: 10 },
    nameTextStyle: { color: '#c8d7f5', fontSize: 10 }
  },
  series: [
    {
      name: '营收', type: 'bar', barWidth: 14, barGap: '20%',
      data: [4200, 3800, 4500, 4900, 5200, 5800, 5500, 6100, 5900, 6400, 6800, 7200],
      itemStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(0, 194, 255, 0.85)' },
          { offset: 1, color: 'rgba(0, 194, 255, 0.15)' }

        borderRadius: [3, 3, 0, 0]
      }
    },
    {
      name: '成本', type: 'bar', barWidth: 14,
      data: [3100, 2800, 3300, 3500, 3700, 4100, 3900, 4300, 4100, 4500, 4700, 5000],
      itemStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(254, 176, 25, 0.85)' },
          { offset: 1, color: 'rgba(254, 176, 25, 0.15)' }
        ]),
        borderRadius: [3, 3, 0, 0]
      }
    },
    {
      name: '利润', type: 'line', smooth: true,
      data: [1100, 1000, 1200, 1400, 1500, 1700, 1600, 1800, 1800, 1900, 2100, 2200],
      lineStyle: { color: '#00e396', width: 2 },
      itemStyle: { color: '#00e396' },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(0, 227, 150, 0.2)' },
          { offset: 1, color: 'rgba(0, 227, 150, 0.01)' }
        ])
      },
      symbol: 'circle', symbolSize: 5
    },
    {
      name: '目标', type: 'line', smooth: true,
      data: [4000, 4200, 4400, 4600, 4800, 5000, 5200, 5400, 5600, 5800, 6000, 6500],
      lineStyle: { color: '#ff4560', width: 2, type: 'dashed' },
      itemStyle: { color: '#ff4560' },
      symbol: 'diamond', symbolSize: 5
    }
  ],
  // Gauge indicators at bottom
  graphic: [
    {
      type: 'group',
      left: 'center',
      bottom: 5,
      children: [
        {
          type: 'text',
          style: {
            text: '年度营收达成率',
            fill: '#c8d7f5',
            fontSize: 12,
            x: -180, y: 0
          }
        },
        {
          type: 'text',
          style: {
            text: '92.6%',
            fill: '#00e396',
            fontSize: 18,
            fontWeight: 'bold',
            fontFamily: 'Orbitron',
            x: -180, y: 22
          }
        },
        {
          type: 'text',
          style: {
            text: '利润率',
            fill: '#c8d7f5',
            fontSize: 12,
            x: 0, y: 0
          }
        },
        {
          type: 'text',
          style: {
            text: '30.5%',
            fill: '#00c2ff',
            fontSize: 18,
            fontWeight: 'bold',
            fontFamily: 'Orbitron',
            x: 0, y: 22
          }

function buildInventoryList() {
  const container = document.getElementById('inventoryList');
  let html = '';
  const buildRows = () => inventoryData.map(item => {
    const pct = Math.round((item.stock / item.min) * 100);
    const barColor = item.status === 'red' ? '#ff4560' : '#feb019';
    return `
      <div style="padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.03);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:12px;"><span class="status-dot ${item.status}"></span>${item.name}</span>
          <span style="font-size:11px; color:${barColor}; font-family:Orbitron,monospace;">${pct}%</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-size:10px; color:rgba(200,215,245,0.5);">${item.sku}</span>
          <span style="font-size:10px; color:rgba(200,215,245,0.5);">库存 ${item.stock} / 安全线 ${item.min}</span>
        </div>
        <div class="progress-bar">
          <div class="fill" style="width:${pct}%; background:linear-gradient(90deg, ${barColor}, ${barColor}88);"></div>
        </div>
      </div>
    `;
  }).join('');

  // Duplicate for seamless scroll
  html = buildRows() + buildRows();
  container.innerHTML = html;
}
buildInventoryList();
